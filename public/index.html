<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0F2433">
<meta name="color-scheme" content="light dark">
<script>(function(){try{var d=document.createElement("div");d.style.cssText="display:none;background-color:canvas;color-scheme:light";document.documentElement.appendChild(d);var c=getComputedStyle(d).backgroundColor;d.parentNode.removeChild(d);if(c&&c!=="rgb(255, 255, 255)")document.documentElement.setAttribute("data-autodark","");}catch(e){}})();</script>
<title>船班追蹤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Plan: deadline plate + bottom line → "which sailing makes it" ruler → one block per sailing
   (CY cut → Kobe → Taiwan → factory) → map + typhoon → data notes.
   Signal yellow is reserved for the deadline. */
:root{
  --paper:#EEF2F1; --panel:#FFFFFF; --panel-2:#F2F6F6; --ink:#0F2433; --ink-2:#3B5060; --ink-3:#5F7383; --rule:#C6D3D8;
  --sea:#D7E6EB; --grid:#C3D5DC; --land:#E5DFC6; --land-edge:#B3AA86; --route:#7C95A4;
  --plate:#0F2433; --plate-ink:#EEF2F1; --signal:#F2B600; --signal-soft:#FBEBB3;
  --ok:#2B7A4B; --ok-soft:#DDEFE3; --watch:#986100; --watch-soft:#F7EACD; --alert:#B5372B; --alert-soft:#F7DDD9; --backup:#2C67A0; --backup-soft:#DCE7F2;
  --focus:#1F6FB2; --hl:#00838F;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-latin:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:var(--f-latin),"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  color-scheme:light dark;
}
:lang(ja){ --f-body:var(--f-latin),"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif; }
/* 跟著系統／瀏覽器的深淺色自動切換。宣告 color-scheme: light dark，
   Edge／Chrome 的「自動深色」就不會再強制改色（以前會把圖表洗成白色）。 */
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0D1A22; --panel:#13232D; --panel-2:#192D39; --ink:#EDF3F5; --ink-2:#C0CDD4; --ink-3:#93A7B3; --rule:#2B4152;
    --sea:#10283A; --grid:#1E3B4C; --land:#2F3527; --land-edge:#4E5640; --route:#7F99A8;
    --plate:#1B3140; --plate-ink:#EEF2F1; --signal:#F5C230; --signal-soft:#3A3013;
    --ok:#69C590; --ok-soft:#163327; --watch:#E3AE4D; --watch-soft:#352A12; --alert:#F27464; --alert-soft:#3B1D19; --backup:#7EB0E0; --backup-soft:#16293A;
    --focus:#6CB4E4; --hl:#3FD7E0; color-scheme:dark;
  }
}
/* Edge／Chrome 開了「網頁內容自動深色」但系統是淺色時，瀏覽器會硬把淺色頁面反轉，地圖會變白塊；
   偵測到就直接改用深色版。 */
:root[data-autodark]{
    --paper:#0D1A22; --panel:#13232D; --panel-2:#192D39; --ink:#EDF3F5; --ink-2:#C0CDD4; --ink-3:#93A7B3; --rule:#2B4152;
    --sea:#10283A; --grid:#1E3B4C; --land:#2F3527; --land-edge:#4E5640; --route:#7F99A8;
    --plate:#1B3140; --plate-ink:#EEF2F1; --signal:#F5C230; --signal-soft:#3A3013;
    --ok:#69C590; --ok-soft:#163327; --watch:#E3AE4D; --watch-soft:#352A12; --alert:#F27464; --alert-soft:#3B1D19; --backup:#7EB0E0; --backup-soft:#16293A;
    --focus:#6CB4E4; --hl:#3FD7E0; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.6;
  padding:max(14px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(40px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
[hidden]{display:none!important}
a{color:inherit; text-underline-offset:2px; text-decoration-color:var(--ink-3)}
a:hover{text-decoration-color:var(--ink)}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:3px}
h1,h2,h3,h4,p,ul,ol{margin:0}
h1,h2{word-break:keep-all; overflow-wrap:anywhere}
:lang(ja) h1, :lang(ja) h2, :lang(ja) .headline{word-break:auto-phrase}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1160px; margin:0 auto; display:grid; grid-template-columns:minmax(0,1fr); gap:36px}
.wrap > *{min-width:0}

/* top bar: language + position refresh */
.topbar{display:flex; justify-content:space-between; align-items:flex-start; gap:12px 20px; flex-wrap:wrap}
.langs{display:inline-flex; border:1px solid var(--ink); border-radius:6px; overflow:hidden}
.langs button{font:600 14px/1 var(--f-body); padding:10px 14px; min-height:40px; border:0; background:transparent; color:var(--ink); cursor:pointer}
.langs button + button{border-left:1px solid var(--ink)}
.langs button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
.sync{display:grid; justify-items:end; gap:4px; text-align:right}
.sync-row{display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:flex-end}
.sync-when{font-size:14px; color:var(--ink-2)}
.sync-note{font-size:13px; color:var(--ink-3); max-width:48ch}
.btn{font:600 15px/1 var(--f-body); color:var(--paper); background:var(--ink); border:0; border-radius:6px; padding:11px 16px; min-height:42px; cursor:pointer}
.btn:hover{opacity:.88}
.btn:disabled{opacity:.5; cursor:default}

/* masthead */
.mast{display:grid; gap:6px}
.cargo{font-size:15px; color:var(--ink-2)}
h1{font-family:var(--f-display); font-weight:700; font-size:clamp(32px,5.2vw,52px); line-height:1.02; letter-spacing:.005em; text-wrap:balance}
:lang(ja) h1, :lang(zh-Hant) h1{font-family:var(--f-body); font-weight:700; letter-spacing:.02em; font-size:clamp(28px,4.4vw,44px); line-height:1.15}
.route{font-size:16px; color:var(--ink-2)}
.banner{padding:12px 16px; border-radius:6px; background:var(--alert-soft); border-left:4px solid var(--alert); font-size:15px}

/* lead: deadline plate + bottom line */
.lead{display:grid; grid-template-columns:250px minmax(0,1fr); background:var(--panel); border:1px solid var(--rule); border-radius:8px; overflow:hidden}
.plate{background:var(--plate); color:var(--plate-ink); padding:30px 22px 22px; display:grid; align-content:start; gap:4px; position:relative}
.plate::before{content:""; position:absolute; left:0; right:0; top:0; height:10px; background:repeating-linear-gradient(135deg, var(--signal) 0 9px, var(--plate) 9px 18px)}
.plate-label{font-size:15px; opacity:.85}
.plate-date{font-family:var(--f-display); font-weight:700; font-size:60px; line-height:1; color:var(--signal); font-variant-numeric:tabular-nums; white-space:nowrap}
.plate-date small{font-size:26px; margin-left:4px; font-weight:600}
.plate-left{font-family:var(--f-display); font-size:26px; font-weight:600; line-height:1.1; margin-top:6px}
.plate-backup{font-size:14.5px; margin-top:10px; padding-top:10px; border-top:1px dashed rgba(238,242,241,.35); opacity:.92}
.plate-backup:empty{display:none}
.bottom{padding:24px 26px 24px; display:grid; gap:14px; align-content:start; border-left:6px solid var(--rule)}
.lead[data-level="ok"] .bottom{border-left-color:var(--ok)}
.lead[data-level="watch"] .bottom{border-left-color:var(--watch)}
.lead[data-level="alert"] .bottom{border-left-color:var(--alert)}
.kicker{font-size:15px; font-weight:600; color:var(--ink-2)}
.headline{font-size:22px; line-height:1.5; font-weight:600; max-width:44em; text-wrap:pretty}
.next{list-style:none; padding:0; display:grid; gap:10px; max-width:52em}
.next li{position:relative; padding-left:22px}
.next li::before{content:""; position:absolute; left:2px; top:.62em; width:9px; height:9px; background:var(--ink)}
.strip-note{padding:10px 12px; border-radius:6px; background:var(--alert-soft); font-size:15px}

/* shipping mode switch: LCL / FCL */
.modebar{display:grid; gap:10px}
.seg{display:inline-flex; flex-wrap:wrap; border:2px solid var(--ink); border-radius:8px; overflow:hidden; justify-self:start; max-width:100%}
.seg button{font:600 17px/1.25 var(--f-body); padding:12px 20px; min-height:52px; border:0; background:var(--panel); color:var(--ink); cursor:pointer; text-align:left}
.seg button + button{border-left:2px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
.seg button small{display:block; font-size:13px; font-weight:500; opacity:.85; margin-top:2px}
.mode-note{font-size:15px; color:var(--ink-2); max-width:80ch}
.tags{display:flex; flex-direction:column; align-items:flex-end; gap:6px; max-width:100%; min-width:0}
.mstat{display:inline-block; font-size:14px; font-weight:600; padding:6px 10px; border-radius:4px; max-width:100%; line-height:1.35}
.mstat[data-s="confirmed"]{background:var(--ok-soft); color:var(--ok)}
.mstat[data-s="asking"], .mstat[data-s="possible"]{background:var(--watch-soft); color:var(--watch)}
.mstat[data-s="full"], .mstat[data-s="na"]{background:var(--alert-soft); color:var(--alert)}
.mnote{font-size:14px; color:var(--ink-2); margin-top:6px; max-width:70ch}
.nomain{padding:16px 18px; border-radius:8px; background:var(--alert-soft); border-left:5px solid var(--alert); font-weight:600}

/* section heads */
.sec-head{display:flex; justify-content:space-between; align-items:baseline; gap:6px 20px; flex-wrap:wrap; margin-bottom:12px}
h2{font-size:24px; line-height:1.25; font-weight:700; text-wrap:balance}
.sec-head p{color:var(--ink-2); font-size:14px; max-width:70ch}
.panel{background:var(--panel); border:1px solid var(--rule); border-radius:8px}

/* ruler */
.ruler-wrap{padding:10px 8px 6px}
.ruler{display:block; width:100%; height:auto}
.ruler text{font-family:var(--f-body)}
.legend{list-style:none; padding:0; margin-top:10px; display:flex; flex-wrap:wrap; gap:6px 18px; font-size:14px; color:var(--ink-2)}
.legend li{display:inline-flex; align-items:center; gap:7px}
.sw{display:inline-block; width:14px; height:14px; border-radius:2px}
.sw.ok{background:var(--ok)} .sw.watch{background:var(--watch)} .sw.alert{background:var(--alert)} .sw.backup{background:var(--backup)}
.sw.band{background:var(--signal-soft); border:1px solid var(--signal)}
.sw.dl{background:repeating-linear-gradient(135deg, var(--signal) 0 3px, transparent 3px 6px); border:2px solid var(--signal)}

/* sailing blocks */
.ships{display:grid; gap:18px}
.ship{background:var(--panel); border:1px solid var(--rule); border-left:6px solid var(--ink-3); border-radius:8px; padding:20px 22px 14px; display:grid; gap:18px}
.ship[data-level="ok"]{border-left-color:var(--ok)}
.ship[data-level="watch"]{border-left-color:var(--watch)}
.ship[data-level="alert"]{border-left-color:var(--alert)}
.ship-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px 16px; flex-wrap:wrap}
.ship-name{font-family:var(--f-display); font-weight:700; font-size:32px; line-height:1; letter-spacing:.015em}
.ship-meta{margin-top:6px; display:flex; flex-wrap:wrap; gap:4px 16px; font-size:15px; color:var(--ink-2)}
.ship-meta .voy{font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums}
.role{display:inline-block; font-size:14px; font-weight:600; padding:6px 10px; border-radius:4px; border:1.5px solid var(--ink-3); color:var(--ink-2); max-width:100%; line-height:1.35}
.ship-head > div{min-width:0}
.role[data-tier="base"]{background:var(--ink); border-color:var(--ink); color:var(--paper)}
.role[data-tier="check"]{border-color:var(--ink); color:var(--ink)}
.role[data-tier="backup"]{border-style:dashed; border-color:var(--backup); color:var(--backup)}

.legs{list-style:none; padding:0; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:0}
.leg{position:relative; padding:12px 18px 4px 0; border-top:3px solid var(--rule); display:grid; align-content:start; gap:4px; min-width:0}
.leg + .leg{padding-left:18px}
.leg + .leg::before{content:""; position:absolute; left:-7px; top:-9px; width:12px; height:12px; background:var(--panel); border-top:3px solid var(--rule); border-right:3px solid var(--rule); transform:rotate(45deg)}
.leg-label{font-size:14px; color:var(--ink-2); font-weight:500}
.leg-label small{font-size:12.5px; color:var(--ink-3); margin-left:4px; font-weight:400}
.leg-val{font-family:var(--f-display); font-size:26px; font-weight:600; line-height:1.1; font-variant-numeric:tabular-nums; word-break:keep-all; overflow-wrap:anywhere}
.leg-val.passed{color:var(--alert)}
.leg-note{font-size:14px; color:var(--ink-2); line-height:1.5}
.leg-note ul{padding-left:1.1em; display:grid; gap:2px; list-style:disc}
.badge{justify-self:start; font-size:12.5px; font-weight:600; padding:3px 7px; border-radius:3px; line-height:1.2}
.badge[data-b="live"]{background:var(--ok-soft); color:var(--ok)}
.leg.plant{border-top-color:var(--ink-3)}
.leg.plant[data-fit="ok"]{border-top-color:var(--ok)}
.leg.plant[data-fit="edge"]{border-top-color:var(--watch)}
.leg.plant[data-fit="partial"], .leg.plant[data-fit="backup"]{border-top-color:var(--backup)}
.leg.plant[data-fit="late"], .leg.plant[data-fit="miss"], .leg.plant[data-fit="risk"]{border-top-color:var(--alert)}
.fit{font-size:14.5px; font-weight:600; line-height:1.4}
.fit[data-fit="ok"]{color:var(--ok)} .fit[data-fit="edge"]{color:var(--watch)} .fit[data-fit="partial"], .fit[data-fit="backup"]{color:var(--backup)} .fit[data-fit="late"], .fit[data-fit="miss"], .fit[data-fit="risk"]{color:var(--alert)}
.leg-official{font-size:13.5px; color:var(--ink-2); line-height:1.45; border-left:3px solid var(--watch); padding-left:8px; margin-top:4px}
.leg-official strong{color:var(--ink); font-weight:600}

.ship-body{display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:18px 28px}
.ship-body h4{font-size:15px; font-weight:600; color:var(--ink-2); display:flex; align-items:center; gap:10px; margin-bottom:8px}
.chip{display:inline-flex; align-items:center; gap:6px; font-size:13.5px; font-weight:600; padding:3px 9px; border-radius:999px; border:1.5px solid currentColor; line-height:1.3}
.chip::before{content:""; width:7px; height:7px; border-radius:50%; background:currentColor}
.chip[data-level="ok"]{color:var(--ok)} .chip[data-level="watch"]{color:var(--watch)} .chip[data-level="alert"]{color:var(--alert)} .chip[data-level="none"]{color:var(--ink-3)}
.assess ul{padding-left:1.15em; display:grid; gap:6px}
.assess li::marker{color:var(--ink-3)}
.assess p{max-width:60ch}
.flag{margin-top:12px; padding:10px 12px; border-radius:6px; background:var(--alert-soft); font-size:14.5px}
.flag strong{color:var(--alert)}
.pos{background:var(--panel-2); border-radius:6px; padding:12px 14px; align-self:start}
.pos-where{font-weight:600}
.pos p{font-size:14.5px; color:var(--ink-2); margin-top:4px}
.pos .tag{font-size:12.5px; font-weight:600; margin-left:6px; padding:2px 6px; border-radius:3px}
.pos .tag.fresh{background:var(--ok-soft); color:var(--ok)}
.pos .tag.stale{background:var(--watch-soft); color:var(--watch)}
.pos .err{color:var(--watch)}

.more{border-top:1px solid var(--rule); padding-top:10px}
.more summary, .refs > summary, .about > summary{cursor:pointer; font-weight:600; color:var(--ink-2); list-style-position:outside}
.more summary{font-size:14.5px; padding:4px 0}
.more-body{display:grid; gap:12px; padding:10px 0 6px; font-size:14px; color:var(--ink-2)}
.more-body h5{font-size:13.5px; margin:0 0 4px; color:var(--ink)}
.more-body ul{padding-left:1.1em; display:grid; gap:3px}
.more-body .was s{text-decoration-thickness:1px}
.linkrow{display:flex; flex-wrap:wrap; gap:6px 16px}

.refs{margin-top:22px}
.refs > summary{font-size:17px; padding:10px 0}
.refs .ships{margin-top:10px}
.refs .ship{opacity:.92}

/* map + typhoon */
.two{display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:24px; align-items:start}
.two > *{min-width:0}
.map-wrap{padding:8px; overflow:hidden}
.chart{display:block; width:100%; height:auto; border-radius:4px}
.chart text{font-family:var(--f-body)}
.offmap{margin-top:10px; font-size:14px; color:var(--ink-2)}
/* typhoon vs ship simulation */
.shadow-link{margin:-4px 0 14px; font-weight:600}
.shadow-link a{display:inline-block; padding:8px 12px; border:1.5px solid var(--focus); border-radius:6px; color:var(--focus); text-decoration:none; background:var(--panel)}
.shadow-link a:hover{background:var(--panel-2)}
.btn.shadow-top{display:inline-flex; align-items:center; text-decoration:none; font-size:14px; padding:10px 14px; min-height:40px; border-color:var(--focus); color:var(--focus)}
.sim-grid{display:grid; grid-template-columns:minmax(0,1.55fr) minmax(0,1fr); gap:20px; align-items:start}
.sim-grid > *{min-width:0}
.sim-side{display:grid; gap:16px}
.scrub{margin-top:12px}
.scrub-top{display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap}
.tlabel{font-size:18px; font-variant-numeric:tabular-nums}
.tlabel small{font-size:13px; color:var(--ink-3); font-weight:500}
.btn.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--ink-3)}
.strip{display:block; width:100%; height:auto; margin-top:10px}
#tSlider{display:block; width:100%; margin:2px 0 0; height:28px; accent-color:var(--focus); cursor:pointer}
.map-legend{margin-top:12px; font-size:14px}
.sw.sw-ship{background:var(--ok); border-radius:50%}
.sw.sw-ais{background:var(--panel); border:2px solid var(--ink); border-radius:50%}
.sw.sw-jma{background:var(--alert)}
.sw.sw-cwa{background:var(--backup)}
.sw.sw-prob{background:transparent; border:1.5px dashed var(--ink-2); border-radius:50%}
.simbox{padding:16px 18px; display:grid; gap:14px}
.sim-time{margin:0}
.sim-time strong{font-size:22px; font-family:var(--f-display); letter-spacing:.01em}
.sim-time small{display:block; color:var(--ink-3); font-size:13px}
.sim-row{display:grid; gap:4px; border-top:1px solid var(--rule); padding-top:10px}
.sim-row h4{margin:0; font-size:14px; color:var(--ink-2); font-weight:700; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.sim-row h4 small{font-weight:500; color:var(--ink-3)}
.sim-row[data-ag="jma"] h4{color:var(--alert)}
.sim-row[data-ag="cwa"] h4{color:var(--backup)}
.sim-row p{margin:0; font-size:15px}
.sim-rule{font-size:14px; color:var(--ink-2)}
.sim-cargo{color:var(--watch); font-weight:600}
.tablewrap{padding:4px 16px 12px; overflow-x:auto}
.tablewrap table{width:100%; border-collapse:collapse; font-size:15px}
.tablewrap th, .tablewrap td{text-align:left; padding:10px 8px; border-top:1px solid var(--rule); vertical-align:top}
.tablewrap thead th{border-top:0; font-size:13px; color:var(--ink-3); font-weight:600; padding-top:12px}
.tablewrap tbody th{font-weight:700; white-space:nowrap}
.tablewrap tbody th small{font-weight:500; color:var(--ink-3)}
.tablewrap .tag-ours{display:block; color:var(--watch); font-weight:600; white-space:normal}
.tablewrap tr.ours th, .tablewrap tr.ours td{background:var(--watch-soft)}
.tablewrap tr.dim{opacity:.72}
.tablewrap .chip{white-space:normal}
.simt tr.r-leg th{font-weight:500; color:var(--ink-2)}
.simt tr.r-leg th, .simt tr.r-leg td{font-size:14px; padding-top:6px; padding-bottom:6px}
.muted{color:var(--ink-3)}
.ok-t{color:var(--ok); font-weight:600}
.sim-sub-h{font-size:16px; margin:16px 0 8px}
.chain{list-style:none; padding:0; margin:0 0 6px; display:grid; gap:8px; font-size:15px}
.chain small{display:block; margin-top:2px}
.proc{padding:18px 20px; margin-top:22px}
.proc h3{font-size:18px; margin:0 0 12px}
.proc .proc-steps{list-style:none; padding:0; margin:0; display:grid; gap:14px}
.proc .proc-steps li{border-left:4px solid var(--rule); padding:2px 0 2px 14px; max-width:95ch}
.proc .proc-steps h4{margin:0 0 4px; font-size:16px}
.proc .proc-steps p{margin:0; font-size:15px; color:var(--ink-2)}

.leg-label{font-size:15px}

  Array.prototype.forEach.call(document.querySelectorAll("#modeSeg button"), function(b){ b.addEventListener("click", function(){ setMode(b.getAttribute("data-mode")); }); });
  Array.prototype.forEach.call(document.querySelectorAll("#viewbar button"), function(b){ b.addEventListener("click", function(){ setView(b.getAttribute("data-view")); }); });
  try { var mqDark = window.matchMedia("(prefers-color-scheme: dark)"); var onScheme = function(){ renderChart(); renderRuler(); renderCal(); }; if (mqDark.addEventListener) mqDark.addEventListener("change", onScheme); else if (mqDark.addListener) mqDark.addListener(onScheme); } catch(e){}
  document.getElementById("others").addEventListener("toggle", function(){ if (this.open) renderRuler(); });
  var rz = null, lastW = window.innerWidth;
  window.addEventListener("resize", function(){ if (window.innerWidth === lastW) return; lastW = window.innerWidth; clearTimeout(rz); rz = setTimeout(function(){ renderRuler(); renderChart(); renderCal(); }, 150); });
  setInterval(function(){ if (document.visibilityState === "visible") fetchData(true); else renderHeader(); }, 5 * 60 * 1000);
  // 回到這個分頁、或從上一頁／下一頁回來（瀏覽器快取的頁面）時也重抓：超過 1 分鐘沒更新就抓
  document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible" && (!state.liveAt || Date.now() - (t(state.liveAt) || 0) > 60000)) fetchData(true); });
  window.addEventListener("pageshow", function(e){ if (e.persisted) fetchData(true); });
  document.getElementById("tSlider").addEventListener("input", function(){ if (SIM.playing){ clearInterval(SIM.playing); SIM.playing = null; renderMapChrome(); } setSim(+this.value, true); });
  document.getElementById("playBtn").addEventListener("click", togglePlay);
  document.getElementById("nowBtn").addEventListener("click", function(){ if (SIM.playing){ clearInterval(SIM.playing); SIM.playing = null; } SIM.user = false; renderMapChrome(); simPrepare(); setSim(SIM.t0, false); });
  setInterval(function(){ if (state.meta){ renderHeader(); renderRuler(); } }, 60000);

  lang = pickLang();
  (function(){ var q = null; try { q = new URLSearchParams(location.search).get("view"); } catch(e){} if (VIEWS.indexOf(q) >= 0){ state.view = q; } else { var sv = load("ship-tracker-view"); state.view = VIEWS.indexOf(sv) >= 0 ? sv : "simple"; } })();
  (function(){ var q = null; try { q = new URLSearchParams(location.search).get("tab"); } catch(e){} if (q === "yim") state.tab = "yim"; })();
  (function(){ var q = null; try { q = new URLSearchParams(location.search).get("mode"); } catch(e){} q = q ? q.toUpperCase() : load("ship-tracker-mode"); if (MODES.indexOf(q) >= 0) state.mode = q; })();
  renderAll();
  fetchData(true);
})();
</script>
</body>
</html>

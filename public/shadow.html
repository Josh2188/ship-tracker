<title>影子模擬紀錄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Shadow-simulation archive: every 8 h a copy of the typhoon forecasts, Yang Ming port calls and AIS is saved;
   pick two copies and compare. Same tokens as the tracker page. */
:root{
  --paper:#EEF2F1; --panel:#FFFFFF; --panel-2:#F2F6F6; --ink:#0F2433; --ink-2:#3B5060; --ink-3:#5F7383; --rule:#C6D3D8;
  --sea:#D7E6EB; --grid:#C3D5DC; --land:#E5DFC6; --land-edge:#B3AA86; --route:#7C95A4;
  --signal:#F2B600; --ok:#2B7A4B; --ok-soft:#DDEFE3; --watch:#986100; --watch-soft:#F7EACD; --alert:#B5372B; --alert-soft:#F7DDD9; --backup:#2C67A0;
  --focus:#1F6FB2;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-latin:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:var(--f-latin),"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  color-scheme:light dark;
}
:lang(ja){ --f-body:var(--f-latin),"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif; }
@media (prefers-color-scheme: dark){ :root{
  --paper:#0D1A22; --panel:#13232D; --panel-2:#192D39; --ink:#EDF3F5; --ink-2:#C0CDD4; --ink-3:#93A7B3; --rule:#2B4152;
  --sea:#10283A; --grid:#1E3B4C; --land:#2F3527; --land-edge:#4E5640; --route:#7F99A8;
  --signal:#F5C230; --ok:#69C590; --ok-soft:#163327; --watch:#E3AE4D; --watch-soft:#352A12; --alert:#F27464; --alert-soft:#3B1D19; --backup:#7EB0E0; --focus:#6CB4E4; color-scheme:dark; } }
:root[data-autodark]{
  --paper:#0D1A22; --panel:#13232D; --panel-2:#192D39; --ink:#EDF3F5; --ink-2:#C0CDD4; --ink-3:#93A7B3; --rule:#2B4152;
  --sea:#10283A; --grid:#1E3B4C; --land:#2F3527; --land-edge:#4E5640; --route:#7F99A8;
  --signal:#F5C230; --ok:#69C590; --ok-soft:#163327; --watch:#E3AE4D; --watch-soft:#352A12; --alert:#F27464; --alert-soft:#3B1D19; --backup:#7EB0E0; --focus:#6CB4E4; color-scheme:dark; }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.6;
  padding:max(14px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(40px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
h1,h2,h3,h4,p,ul{margin:0}
a{color:inherit; text-underline-offset:2px}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:3px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1160px; margin:0 auto; display:grid; grid-template-columns:minmax(0,1fr); gap:30px}
.wrap > *{min-width:0}
.topbar{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap}
.langs{display:inline-flex; border:1px solid var(--ink); border-radius:6px; overflow:hidden}
.langs button{font:600 14px/1 var(--f-body); padding:10px 14px; min-height:40px; border:0; background:transparent; color:var(--ink); cursor:pointer}
.langs button + button{border-left:1px solid var(--ink)}
.langs button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
.back{font-weight:600; font-size:15px}
.mast h1{font-family:var(--f-display); font-size:clamp(30px, 6vw, 46px); line-height:1.1; letter-spacing:.005em}
.mast p{color:var(--ink-2); margin-top:8px; max-width:80ch}
.panel{background:var(--panel); border:1px solid var(--rule); border-radius:8px}
.sec-head{display:flex; justify-content:space-between; align-items:baseline; gap:6px 20px; flex-wrap:wrap; margin-bottom:12px}
.sec-head h2{font-size:22px}
.sec-head p{color:var(--ink-2); font-size:14.5px; max-width:72ch}
.btn{font:600 15px/1 var(--f-body); color:var(--paper); background:var(--ink); border:0; border-radius:6px; padding:11px 16px; min-height:42px; cursor:pointer}
.btn.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--ink-3)}
.pick{padding:16px 18px; display:grid; grid-template-columns:repeat(2, minmax(0,1fr)) auto; gap:12px 18px; align-items:end}
.pick label{display:grid; gap:6px; font-size:14px; font-weight:600; color:var(--ink-2)}
.pick select{font:500 15px var(--f-body); padding:9px 10px; border-radius:6px; border:1.5px solid var(--ink-3); background:var(--panel); color:var(--ink); min-height:42px; width:100%}
.pick .quick{display:flex; gap:8px; flex-wrap:wrap}
.tag{display:inline-block; font-size:12px; font-weight:700; padding:1px 7px; border-radius:3px; margin-right:6px; vertical-align:2px}
.tag.a{background:var(--panel-2); color:var(--ink-2); border:1px solid var(--ink-3)}
.tag.b{background:var(--ink); color:var(--paper)}
.tablewrap{padding:4px 16px 12px; overflow-x:auto}
table{width:100%; border-collapse:collapse; font-size:15px}
th, td{text-align:left; padding:10px 8px; border-top:1px solid var(--rule); vertical-align:top}
thead th{border-top:0; font-size:13px; color:var(--ink-3); font-weight:600; padding-top:12px}
tbody th{font-weight:700}
tbody th small, td small{display:block; font-weight:500; color:var(--ink-3); font-size:13px}
td.chg{font-weight:600}
.same{color:var(--ink-3); font-weight:500}
.later{color:var(--alert)} .earlier{color:var(--ok)} .moved{color:var(--watch)}
tr.hl th, tr.hl td{background:var(--watch-soft)}
.chip{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; padding:2px 8px; border-radius:999px; border:1.5px solid currentColor; line-height:1.3; white-space:normal}
.chip::before{content:""; width:7px; height:7px; border-radius:50%; background:currentColor; flex:none}
.chip[data-level="ok"]{color:var(--ok)} .chip[data-level="watch"]{color:var(--watch)} .chip[data-level="alert"]{color:var(--alert)} .chip[data-level="none"]{color:var(--ink-3)}
.badge{font-size:12px; font-weight:600; padding:2px 6px; border-radius:3px; white-space:nowrap}
.badge[data-b="live"]{background:var(--ok-soft); color:var(--ok)}
.badge[data-b="fallback"]{background:var(--watch-soft); color:var(--watch)}
.badge[data-b="verified"]{background:var(--panel-2); color:var(--ink-2); border:1px solid var(--rule)}
.sim-grid{display:grid; grid-template-columns:minmax(0,1.55fr) minmax(0,1fr); gap:20px; align-items:start}
.sim-grid > *{min-width:0}
.map-wrap{padding:8px; overflow:hidden}
.chart{display:block; width:100%; height:auto; border-radius:4px}
.chart text{font-family:var(--f-body)}
.scrub{margin-top:12px}
.scrub-top{display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap}
.tlabel{font-size:18px; font-variant-numeric:tabular-nums}
.tlabel small{font-size:13px; color:var(--ink-3)}
#tSlider{display:block; width:100%; margin:10px 0 0; height:28px; accent-color:var(--focus); cursor:pointer}
.legend{list-style:none; padding:0; margin-top:12px; display:flex; flex-wrap:wrap; gap:6px 18px; font-size:14px; color:var(--ink-2)}
.legend li{display:inline-flex; align-items:center; gap:7px}
.sw{display:inline-block; width:22px; height:0; border-top:3px solid var(--ink)}
.sw.jma{border-color:var(--alert)} .sw.cwa{border-color:var(--backup); border-top-style:dashed}
.sw.old{opacity:.4}
.sw.dot{width:10px; height:10px; border:0; border-radius:50%; background:var(--ink)}
.sw.tydot{width:10px; height:10px; border:0; border-radius:50%; background:var(--alert)}
.box{padding:16px 18px; display:grid; gap:12px}
.box .when strong{font-size:22px; font-family:var(--f-display)}
.box .when small{display:block; color:var(--ink-3); font-size:13px}
.box h4{font-size:14px; color:var(--ink-2); margin:0 0 2px}
.box .row{border-top:1px solid var(--rule); padding-top:10px; display:grid; gap:3px; font-size:15px}
.box .row[data-ag="jma"] h4{color:var(--alert)} .box .row[data-ag="cwa"] h4{color:var(--backup)}
.muted{color:var(--ink-3)}
.notes{font-size:14.5px; color:var(--ink-2); display:grid; gap:6px; padding-left:1.15em; max-width:90ch}
.empty{padding:18px}
@media (max-width: 899px){ .sim-grid{grid-template-columns:minmax(0,1fr)} .pick{grid-template-columns:minmax(0,1fr)} }
@media (max-width: 640px){
  .tablewrap{padding:2px 12px 10px}
  .stack table, .stack tbody, .stack tr, .stack th, .stack td{display:block; width:100%}
  .stack thead{display:none}
  .stack tr{border-top:1px solid var(--rule); padding:8px 0}
  .stack tbody th, .stack td{border-top:0; padding:3px 4px}
  .stack td[data-l]::before{content:attr(data-l); display:block; font-size:12.5px; color:var(--ink-3); font-weight:600}
}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="topbar">
    <div class="langs" role="group" id="langbar" aria-label="Language">
      <button type="button" data-lang="zh" lang="zh-Hant">繁中</button><button type="button" data-lang="ja" lang="ja">日本語</button><button type="button" data-lang="en" lang="en">English</button>
    </div>
    <a class="back" id="back" href="./"></a>
  </div>
  <header class="mast"><h1 id="title"></h1><p id="sub"></p></header>

  <section aria-labelledby="pickH">
    <div class="sec-head"><h2 id="pickH"></h2><p id="pickSub"></p></div>
    <div class="panel pick">
      <label><span id="labA"></span><select id="selA"></select></label>
      <label><span id="labB"></span><select id="selB"></select></label>
      <div class="quick"><button class="btn" type="button" id="qPrev"></button><button class="btn ghost" type="button" id="qFirst"></button></div>
    </div>
  </section>

  <section aria-labelledby="diffH">
    <div class="sec-head"><h2 id="diffH"></h2><p id="diffSub"></p></div>
    <div class="panel tablewrap stack" id="diff"></div>
  </section>

  <section aria-labelledby="fcH">
    <div class="sec-head"><h2 id="fcH"></h2><p id="fcSub"></p></div>
    <div class="panel tablewrap stack" id="fc"></div>
  </section>

  <section aria-labelledby="mapH">
    <div class="sec-head"><h2 id="mapH"></h2><p id="mapSub"></p></div>
    <div class="sim-grid">
      <div>
        <div class="panel map-wrap" id="chartWrap"><svg class="chart" id="chart" role="img"></svg></div>
        <div class="scrub">
          <div class="scrub-top"><button class="btn" id="playBtn" type="button"></button><span class="tlabel" id="tLabel"></span></div>
          <input type="range" id="tSlider">
        </div>
        <ul class="legend" id="legend"></ul>
      </div>
      <div class="panel box" id="box"></div>
    </div>
  </section>

  <section aria-labelledby="allH">
    <div class="sec-head"><h2 id="allH"></h2><p id="allSub"></p></div>
    <div class="panel tablewrap stack" id="all"></div>
  </section>

  <section aria-labelledby="howH">
    <div class="sec-head"><h2 id="howH"></h2></div>
    <ul class="notes" id="how"></ul>
  </section>
</div>

    if (S.ms == null || S.ms < S.t0 || S.ms > S.t1) S.ms = Math.max(S.t0, Math.floor(Date.now() / H) * H);
    S.ms = Math.min(S.ms, S.t1);
    var sl = document.getElementById("tSlider"); sl.min = String(S.t0); sl.max = String(S.t1); sl.step = String(H); sl.value = String(S.ms); sl.setAttribute("aria-label", T("mapH"));
  }
  function render(){
    chrome();
    if (!S.index.length){ document.getElementById("diff").innerHTML = "<p class=\"empty\">" + esc(T("noData")) + "</p>"; return; }
    selects(); renderAll2();
    var A = S.snaps[S.a], B = S.snaps[S.b];
    if (!A || !B){ document.getElementById("diff").innerHTML = "<p class=\"empty\">" + esc(T("loading")) + "</p>"; return; }
    if (S.index.length === 1) document.getElementById("diffSub").textContent = T("only1");
    renderDiff(A, B); renderFc(A, B); setRange(); drawStatic(A, B); drawAt(S.ms);
  }
  function choose(a, b){
    // keep A older than B
    var ia = S.index.map(function(r){ return r.id; }).indexOf(a), ib = S.index.map(function(r){ return r.id; }).indexOf(b);
    if (ia > ib){ var x = a; a = b; b = x; }
    S.a = a; S.b = b; render();
    Promise.all(S.index.map(function(r){ return getSnap(r.id); })).then(render);
  }
  function quick(which){ var n = S.index.length; if (!n) return; var b = S.index[n - 1].id, a = which === "first" ? S.index[0].id : S.index[Math.max(0, n - 2)].id; choose(a, b); }

  /* ---------- events ---------- */
  Array.prototype.forEach.call(document.querySelectorAll("#langbar button"), function(b){ b.addEventListener("click", function(){ lang = b.getAttribute("data-lang"); store("ship-tracker-lang", lang); try { var u = new URL(location.href); u.searchParams.set("lang", lang); history.replaceState(null, "", u.toString()); } catch(e){} render(); }); });
  document.getElementById("selA").addEventListener("change", function(){ choose(this.value, S.b); });
  document.getElementById("selB").addEventListener("change", function(){ choose(S.a, this.value); });
  document.getElementById("qPrev").addEventListener("click", function(){ quick("prev"); });
  document.getElementById("qFirst").addEventListener("click", function(){ quick("first"); });
  document.getElementById("tSlider").addEventListener("input", function(){ if (S.playing){ clearInterval(S.playing); S.playing = null; chrome(); } S.ms = +this.value; drawAt(S.ms); });
  document.getElementById("playBtn").addEventListener("click", function(){
    if (S.playing){ clearInterval(S.playing); S.playing = null; chrome(); return; }
    if (S.ms >= S.t1) S.ms = S.t0;
    S.playing = setInterval(function(){ if (S.ms + H > S.t1){ clearInterval(S.playing); S.playing = null; chrome(); return; } S.ms += H; document.getElementById("tSlider").value = String(S.ms); drawAt(S.ms); }, 70);
    chrome();
  });
  var rz = null, lastW = window.innerWidth;
  window.addEventListener("resize", function(){ if (window.innerWidth === lastW) return; lastW = window.innerWidth; clearTimeout(rz); rz = setTimeout(function(){ if (S.snaps[S.a] && S.snaps[S.b]){ drawStatic(S.snaps[S.a], S.snaps[S.b]); drawAt(S.ms); } }, 150); });

  (function(){ var q = null; try { q = new URLSearchParams(location.search).get("lang"); } catch(e){} var s = load("ship-tracker-lang"); var nav = (navigator.language || "").toLowerCase();
    lang = LANGS.indexOf(q) >= 0 ? q : (LANGS.indexOf(s) >= 0 ? s : (nav.indexOf("ja") === 0 ? "ja" : (nav.indexOf("zh") === 0 || !nav ? "zh" : "en"))); })();
  chrome();
  document.getElementById("diff").innerHTML = "<p class=\"empty\">" + esc(T("loading")) + "</p>";
  fetch("shadow/index.json?t=" + Date.now(), { cache: "no-store" }).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); }).then(function(idx){
    S.index = (Array.isArray(idx) ? idx : []).sort(function(a, b){ return t(a.takenAt) - t(b.takenAt); });
    if (!S.index.length){ render(); return; }
    quick("prev");
  }).catch(function(){ document.getElementById("diff").innerHTML = "<p class=\"empty\">" + esc(T("loadErr")) + "</p>"; });
})();
</script>
</body>
</html>
